[project]
name = "douyin-live-copilot"
version = "0.0.1"
description = "自用的直播提词与评论互动助手"
requires-python = ">=3.12,<3.13"
dependencies = [
    # DouyinLiveWebFetcher 的依赖，版本与其 requirements.txt 一致
    "requests==2.31.0",
    "betterproto==2.0.0b6",
    "websocket-client==1.7.0",
    "PyExecJS==1.5.1",
    "mini_racer==0.12.4",
    # 模型比选（OpenAI 兼容接口）
    "openai>=1.40,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
